---
- name: Deploy Helm application
  hosts: localhost
  gather_facts: false

  vars:
    deployment_environment: "{{ target_environment | default('dev') }}"
    application_name: "{{ application }}"
    application_directory: "{{ playbook_dir }}/../applications/{{ application_name }}"
    helm_release_state: present

  tasks:
    - name: Load application definition
      ansible.builtin.include_vars:
        file: "{{ application_directory }}/application.yaml"
        name: application_definition

    - name: Deploy application
      ansible.builtin.include_role:
        name: helm-release